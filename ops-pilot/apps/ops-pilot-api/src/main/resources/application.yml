spring:
  application:
    name: ops-pilot-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ops_pilot}
    username: ${DB_USER:ops_pilot}
    password: ${DB_PASSWORD:local-only-change-me}
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
      maximum-pool-size: 10
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${OTEL_EXPORTER_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
          timeout: 5s
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: OpsPilot modular monolith API
